# Gateway: phục vụ web tĩnh + cache tile như CDN + chuyển tiếp API
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:50m max_size=2g inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:20m max_size=2g inactive=30d use_temp_path=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json
             application/x-protobuf application/vnd.mapbox-vector-tile;

  # Vector tile từ Martin: cache ở gateway + trình duyệt; giống CDN đặt trước tile server
  location /tiles/ {
    proxy_pass http://martin:3000/;
    proxy_set_header Accept-Encoding "";
    proxy_cache tiles;
    # khoá = đường dẫn, bỏ query: ?v=<phiên bản> chỉ để trình duyệt tải lại; API xoá đúng file theo md5 của khoá này
    proxy_cache_key $uri;
    proxy_cache_valid 200 204 1h;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400" always;
  }

  # Ảnh đã thu nhỏ (WebP) từ imgproxy, cache 30 ngày
  location /img/ {
    proxy_pass http://imgproxy:8080/;
    proxy_cache img;
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # JS/CSS có hash trong tên file -> cache 1 năm
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
